<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        
        body {
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: #2874f0;
            color: white;
            height: 100vh;
            padding: 20px;
            position: fixed;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .sidebar ul {
            list-style: none;
        }

        .sidebar ul li {
            padding: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .sidebar ul li:hover {
            background: #1a5ac2;
        }

        /* Main Content */
        .main-content {
            margin-left: 250px;
            padding: 20px;
            width: 100%;
        }

        .dashboard-cards {
            display: flex;
            gap: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            flex: 1;
            text-align: center;
        }

        /* Product Management */
        .product-management, .schedule-management {
            margin-top: 30px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .product-list, .schedule-list {
            margin-top: 10px;
        }

        .product-list div, .schedule-list div {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #ccc;
        }

        .delete-btn {
            background: red;
            color: white;
            border: none;
            padding: 5px;
            cursor: pointer;
            border-radius: 4px;
        }

        .add-product input {
            padding: 8px;
            width: 80%;
            margin-right: 5px;
        }

        .add-product button {
            padding: 8px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>Admin Panel</h2>
        <ul>
            <li onclick="showSection('dashboard')">Dashboard</li>
            <li onclick="showSection('product-management')">Manage Products</li>
            <li onclick="showSection('schedule-management')">Repair Schedules</li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        
        <!-- Dashboard -->
        <div id="dashboard">
            <h2>Dashboard</h2>
            <div class="dashboard-cards">
                <div class="card">
                    <h3>Total Users</h3>
                    <p>1,250</p>
                </div>
                <div class="card">
                    <h3>Total Sales</h3>
                    <p>$15,000</p>
                </div>
                <div class="card">
                    <h3>New Bookings</h3>
                    <p>20</p>
                </div>
            </div>
        </div>

        <!-- Product Management -->
        <div id="product-management" class="product-management" style="display: none;">
            <h2>Manage Products</h2>
            <div class="add-product">
                <input type="text" id="product-name" placeholder="Enter Product Name">
                <button onclick="addProduct()">Add</button>
            </div>
            <div class="product-list" id="product-list">
                <h3>Products:</h3>
            </div>
        </div>

        <!-- Schedule Management -->
        <div id="schedule-management" class="schedule-management" style="display: none;">
            <h2>Scheduled Repairs</h2>
            <div class="schedule-list" id="schedule-list">
                <h3>Bookings:</h3>
            </div>
        </div>

    </div>

    <script>
        // Function to switch sections
        function showSection(section) {
            document.getElementById("dashboard").style.display = "none";
            document.getElementById("product-management").style.display = "none";
            document.getElementById("schedule-management").style.display = "none";

            document.getElementById(section).style.display = "block";
        }

        // Add product function
        function addProduct() {
            const productName = document.getElementById("product-name").value;
            if (productName === "") return;

            const productList = document.getElementById("product-list");
            const productDiv = document.createElement("div");

            productDiv.innerHTML = `
                <span>${productName}</span>
                <button class="delete-btn" onclick="this.parentElement.remove()">Delete</button>
            `;

            productList.appendChild(productDiv);
            document.getElementById("product-name").value = "";
        }

        // Dummy data for booked schedules
        const bookedSchedules = [
            { user: "John Doe", car: "Tesla Model 3", date: "2025-02-10" },
            { user: "Jane Smith", car: "Ford Mustang", date: "2025-02-12" }
        ];

        function loadSchedules() {
            const scheduleList = document.getElementById("schedule-list");
            bookedSchedules.forEach(schedule => {
                const scheduleDiv = document.createElement("div");
                scheduleDiv.innerHTML = `
                    <span>${schedule.user} - ${schedule.car} (${schedule.date})</span>
                `;
                scheduleList.appendChild(scheduleDiv);
            });
        }

        // Load schedule data
        loadSchedules();
    </script>

</body>
</html>
